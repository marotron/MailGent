name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: |
          brew untap aws/tap || true
          brew install xcodegen

      - name: Build DMG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MAILGENT_SIGN_IDENTITY: ${{ secrets.MAILGENT_SIGN_IDENTITY }}
          MAILGENT_NOTARY_PROFILE: ${{ secrets.MAILGENT_NOTARY_PROFILE }}
        run: make dmg

      - name: Release title
        id: release
        run: echo "title=${GITHUB_REF_NAME#v} alpha" >> "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: Scripts/release/notes.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.release.outputs.title }}
          body_path: dist/RELEASE_NOTES.md
          files: dist/MailGent-*.dmg
          generate_release_notes: true
          prerelease: true
