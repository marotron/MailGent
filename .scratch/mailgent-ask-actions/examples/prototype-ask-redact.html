<!doctype html>
<!--
  THROWAWAY PROTOTYPE — span redact on Ask body, not a rule.
  Question: where does span redact sit on the Ask body without becoming a rule?
  Variants: ?variant=A|B|C
  Open: open .scratch/mailgent-ask-actions/examples/prototype-ask-redact.html
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MailGent · Ask redact proto</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: #d2d2d7;
      --blue: #0071e3;
      --red: #d70015;
      --amber: #b25e09;
      --mark: #ffe08a;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(180deg, #c5ceda 0%, #9aa6b6 100%);
      color: var(--ink); padding: 24px 16px 100px;
      font: 13px/1.4 inherit;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    .page { max-width: 720px; margin: 0 auto; display: grid; gap: 14px; }
    .note {
      color: #2c3a4a; font-size: 12px; line-height: 1.5;
      background: #ffffffb8; border: 1px solid #ffffff90; border-radius: 10px; padding: 10px 14px;
    }
    .window {
      background: #f5f5f7; border-radius: 10px; border: 1px solid #00000018;
      box-shadow: 0 18px 50px #00000028; overflow: hidden;
    }
    .titlebar {
      height: 38px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #f6f6f7, #ebebec); border-bottom: 1px solid var(--line);
      font-weight: 650; position: relative;
    }
    .traffic { position: absolute; left: 12px; display: flex; gap: 7px; }
    .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .traffic .r { background: #ff5f57; } .traffic .y { background: #febc2e; } .traffic .g { background: #28c840; }
    .body { padding: 14px; display: grid; gap: 10px; }
    .meta { color: var(--muted); font-size: 12px; margin: 0; }
    .preview {
      background: #fff; border: 1px solid var(--line); border-radius: 8px;
      padding: 12px; min-height: 96px; white-space: pre-wrap; line-height: 1.5;
    }
    .preview mark { background: var(--mark); border-radius: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid #f0d2a8; background: #fff6e8; color: var(--amber);
      border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 650;
    }
    .chip button { border: 0; background: transparent; color: var(--amber); font-weight: 700; }
    .footer { display: flex; gap: 8px; }
    .btn {
      border: 1px solid var(--line); background: #fff; border-radius: 6px;
      padding: 6px 14px; font-weight: 650;
    }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.danger { color: var(--red); }
    .spacer { flex: 1; }
    .banner { font-size: 12px; font-weight: 650; padding: 8px 10px; border-radius: 6px; background: #e8e8ed; color: var(--muted); }
    pre.state {
      margin: 0; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #1d1d1f; color: #f5f5f7; border-radius: 8px; padding: 12px;
      white-space: pre-wrap;
    }
    .switcher {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px; z-index: 50;
      background: #1d1d1f; color: #f5f5f7; border-radius: 999px;
      padding: 8px 10px; box-shadow: 0 10px 30px #00000040; font-size: 12px; font-weight: 600;
    }
    .switcher button {
      border: 0; background: #3a3a3c; color: #fff; border-radius: 999px; width: 28px; height: 28px;
    }
    .switcher .label { min-width: 280px; text-align: center; }
  </style>
</head>
<body>
  <div class="page">
    <div class="note">
      <strong>Throwaway proto</strong> · Redact sits on this Ask body. It does not write <code>rules.json</code>.
      Allow returns the masked body for this get. A second get asks again — the cache has no body override yet.
    </div>
    <div class="window">
      <div class="titlebar">
        <div class="traffic" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div>
        Email access request
      </div>
      <div class="body" id="root"></div>
    </div>
    <pre class="state" id="stateDump"></pre>
  </div>
  <div class="switcher">
    <button type="button" id="prevVar" aria-label="Previous variant">←</button>
    <div class="label" id="varLabel"></div>
    <button type="button" id="nextVar" aria-label="Next variant">→</button>
  </div>
<script>
const ORIGINAL = "Hi — your April payslip PDF is attached. Net pay £3,240. Reference PAY-2026-04-118.\n\nPlease do not forward.";
const MASK = "[redacted]";
const VARIANTS = {
  A: "Select text · mask replaces the span",
  B: "Spans listed as chips under the body",
  C: "Redact selection applies [redacted]",
};
const ORDER = ["A", "B", "C"];
const RULES = [{ id: "rule-pass-subject", name: "Subject on" }];

const state = {
  variant: "A",
  agentID: "agent-cursor",
  text: ORIGINAL,
  spans: [],
  decision: null,
  returnedBody: null,
  promptAgain: false,
};

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function selectionInside(el) {
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  if (!el.contains(range.commonAncestorContainer)) return null;
  return sel.toString();
}

function applyMaskToText(source, selected) {
  const i = source.indexOf(selected);
  if (i < 0 || !selected) return source;
  return source.slice(0, i) + MASK + source.slice(i + selected.length);
}

function maskedFromSpans() {
  const cuts = [...state.spans].sort((a, b) => b.start - a.start);
  let text = ORIGINAL;
  for (const span of cuts) text = text.slice(0, span.start) + MASK + text.slice(span.end);
  return text;
}

function highlighted() {
  const cuts = [...state.spans].sort((a, b) => a.start - b.start);
  let html = "";
  let cursor = 0;
  for (const span of cuts) {
    html += esc(ORIGINAL.slice(cursor, span.start));
    html += `<mark>${esc(ORIGINAL.slice(span.start, span.end))}</mark>`;
    cursor = span.end;
  }
  html += esc(ORIGINAL.slice(cursor));
  return html;
}

function allow() {
  const body = state.variant === "B" ? maskedFromSpans() : state.text;
  state.decision = "allow";
  state.returnedBody = body;
  state.promptAgain = false;
  render();
}

function getAgain() {
  state.decision = null;
  state.returnedBody = null;
  state.promptAgain = true;
  state.text = ORIGINAL;
  state.spans = [];
  render();
}

function render() {
  const v = state.variant;
  document.getElementById("varLabel").textContent = `${v} — ${VARIANTS[v]}`;
  const chips = state.spans.map((span, i) =>
    `<span class="chip">${esc(span.text)} <button type="button" data-rm="${i}" aria-label="Remove">×</button></span>`
  ).join("");
  const preview = v === "B" ? highlighted() : esc(state.text);
  const banner = state.returnedBody
    ? "This get returns the masked body"
    : state.promptAgain
      ? "Ask again · cache has no body override"
      : "Select a span, then Allow";
  document.getElementById("root").innerHTML = `
    <p class="meta">Cursor · agent-cursor · Ask Body · ${MESSAGE_LABEL}</p>
    <div class="preview" id="preview">${preview}</div>
    ${v === "B" ? `<div class="chips">${chips || `<span class="meta">No spans yet</span>`}</div>` : ""}
    ${v === "C" ? `<button type="button" class="btn" id="redactBtn">Redact selection</button>` : ""}
    <div class="banner">${esc(banner)}</div>
    <div class="footer">
      <button type="button" class="btn danger" id="blockBtn">Block</button>
      <button type="button" class="btn" id="againBtn">get again</button>
      <span class="spacer"></span>
      <button type="button" class="btn primary" id="allowBtn">Allow</button>
    </div>
  `;
  document.getElementById("allowBtn").addEventListener("click", allow);
  document.getElementById("blockBtn").addEventListener("click", () => {
    state.decision = "block";
    state.returnedBody = null;
    render();
  });
  document.getElementById("againBtn").addEventListener("click", getAgain);
  const previewEl = document.getElementById("preview");
  if (v === "A") {
    previewEl.addEventListener("mouseup", () => {
      const selected = selectionInside(previewEl);
      if (!selected) return;
      state.text = applyMaskToText(state.text, selected);
      getSelection().removeAllRanges();
      render();
    });
  }
  if (v === "B") {
    previewEl.addEventListener("mouseup", () => {
      const selected = selectionInside(previewEl);
      if (!selected) return;
      const start = ORIGINAL.indexOf(selected);
      if (start < 0) return;
      state.spans.push({ start, end: start + selected.length, text: selected });
      getSelection().removeAllRanges();
      render();
    });
  }
  document.getElementById("redactBtn")?.addEventListener("click", () => {
    const selected = selectionInside(previewEl);
    if (!selected) return;
    state.text = applyMaskToText(state.text, selected);
    getSelection().removeAllRanges();
    render();
  });
  document.querySelectorAll("[data-rm]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.spans.splice(Number(btn.dataset.rm), 1);
      render();
    });
  });
  document.getElementById("stateDump").textContent = JSON.stringify({
    variant: state.variant,
    agentID: state.agentID,
    thisGet: state.returnedBody ? { body: state.returnedBody } : null,
    rulesJson: RULES,
    cache: { bodyOverride: null },
    nextGetPrompts: true,
  }, null, 2);
}

const MESSAGE_LABEL = "msg-payslip-2026-04";

function setVariant(key) {
  state.variant = key;
  state.text = ORIGINAL;
  state.spans = [];
  state.decision = null;
  state.returnedBody = null;
  state.promptAgain = false;
  const url = new URL(location.href);
  url.searchParams.set("variant", key);
  history.replaceState(null, "", url);
  render();
}

(() => {
  const v = (new URL(location.href).searchParams.get("variant") || "A").toUpperCase();
  state.variant = VARIANTS[v] ? v : "A";
  document.getElementById("prevVar").addEventListener("click", () => {
    const i = ORDER.indexOf(state.variant);
    setVariant(ORDER[(i + ORDER.length - 1) % ORDER.length]);
  });
  document.getElementById("nextVar").addEventListener("click", () => {
    const i = ORDER.indexOf(state.variant);
    setVariant(ORDER[(i + 1) % ORDER.length]);
  });
  render();
})();
</script>
</body>
</html>
