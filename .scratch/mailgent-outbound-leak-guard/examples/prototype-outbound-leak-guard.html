      letter-spacing: .03em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .badge.grant { background: var(--red-soft); color: var(--red-legend); }
    .badge.leak { background: var(--leak-soft); color: var(--leak); }
    .badge.stealth { background: #eef2ff; color: #3d5afe; }
    .badge.ok { background: #e8f5e9; color: var(--green); }
    .hatch {
      display: block;
      width: 100%;
      min-height: 18px;
      border-radius: 4px;
      position: relative;
      background:
        repeating-linear-gradient(-45deg, var(--red-stripe) 0, var(--red-stripe) 1px, var(--red-soft) 1px, var(--red-soft) 5px);
    }
    .hatch.inline {
      display: inline-block;
      min-width: 80px;
      vertical-align: middle;
    }
    .hatch::after {
      content: "🔒";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      opacity: 0.52;
    }
    .hatch-text {
      visibility: hidden;
      font-size: 12px;
      padding: 2px 4px;
    }
    .withheld-label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--leak-soft);
      border: 1px solid var(--leak-border);
      color: var(--leak);
      font-size: 11px;
      font-weight: 600;
    }
    .sanitized-text {
      background: rgba(122, 61, 184, 0.14);
      border-radius: 3px;
      padding: 0 2px;
      cursor: help;
    }
    .warn { color: var(--amber); font-size: 11px; margin-top: 6px; }
    .err { color: var(--red); font-size: 11px; margin-top: 4px; }
    .check-inline {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 4px 0; cursor: pointer;
    }
    .check-inline input { margin-top: 2px; }
    .info-btn {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 0;
      background: rgba(142, 142, 147, 0.18);
      color: #636366;
      font-size: 11px;
      font-weight: 600;
      font-style: italic;
      font-family: Georgia, "Times New Roman", Times, serif;
      flex: none;
      line-height: 1;
      padding: 0;
      transition: background .12s, color .12s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .info-btn:hover { color: var(--blue); background: var(--blue-soft); }
    .info-btn.on { background: var(--blue-soft); color: var(--blue); }
    .info-panel {
      margin: 0 0 10px;
      padding: 10px 12px;
      border: 1px solid #cfe0f5;
      border-radius: 8px;
      background: linear-gradient(180deg, #f8fbff, #f3f8fe);

      animation: infoIn .18s ease;
    }
    @keyframes infoIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .info-panel h4 { margin: 0 0 6px; font-size: 12px; font-weight: 650; color: var(--ink); }
    .info-panel p { margin: 0 0 6px; }
    .info-panel p:last-child { margin-bottom: 0; }
    .info-panel ul, .info-panel ol { margin: 4px 0 6px; padding-left: 18px; }
    .info-panel li { margin-bottom: 3px; }
    .info-panel code {
      font: 10px/1.35 var(--mono);
      background: #0000000a;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .info-panel .tag {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .03em;
      text-transform: uppercase;
      padding: 1px 5px;
      border-radius: 4px;
      margin-right: 4px;
    }
    .info-panel .tag.grant { background: var(--red-soft); color: var(--red); }
    .info-panel .tag.leak { background: var(--leak-soft); color: var(--leak); }
    .info-panel .info-examples {
      margin: 6px 0 0;
      padding: 6px 8px;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.04);

      text-transform: uppercase;
      margin-right: 4px;
    }
    .row-wrap { margin-bottom: 0; }
    .access-leak-row { margin: 0 0 10px; }

<body>

      Preview on the right shows grant caps + sanitization together.

  <div class="layout">

  </div>

  <script>
    const DEFAULT_FIELDS = {

    const PRESETS = {

    const FIELD_PILLS = {

    const PILL_ICONS = {

      calendar: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="2.5" width="9" height="8" rx="1"/><path d="M4 1.5v2M8 1.5v2M1.5 5h9"/></svg>',
      doc: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 1.5h4l2 2v7a1 1 0 01-1 1H3a1 1 0 01-1-1v-8a1 1 0 011-1z"/><path d="M7 1.5v2h2"/></svg>',
      clip: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M5 6.5V3.5a1.5 1.5 0 013 0v4a2.5 2.5 0 01-5 0V3"/></svg>',
      file: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 1.5h4l2 2v7a1 1 0 01-1 1H3a1 1 0 01-1-1v-8a1 1 0 011-1z"/></svg>',
    };

    const CATALOG = [
      { id: "work", label: "work@gmail.com", mailboxes: ["INBOX", "Sent", "Archive"] },
      { id: "personal", label: "personal@icloud.com", mailboxes: ["INBOX", "Drafts"] },
    ];

    const FIELD_BADGES = [
      { label: "S", key: "subject" },
      { label: "F", key: "from" },
      { label: "T", key: "to" },
      { label: "Cc", key: "cc" },
      { label: "D", key: "date" },
      { label: "B", key: "body" },
      { label: "A", key: "attachmentMetadata" },
      { label: "C", key: "attachmentContent" },
    ];

    const LEAK_GUARD_ICON_SVG = `<svg class="leak-guard-ico" viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M6 1 1.8 2.8v3.2c0 2.4 1.7 4.6 4.2 5.2 2.5-.6 4.2-2.8 4.2-5.2V2.8L6 1z"/><text x="6" y="7.35" text-anchor="middle" font-size="4.8" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,sans-serif">L</text></svg>`;

    function leakGuardChipDemo(state = "on") {
      return `<span class="chip shield ${state} demo" aria-hidden="true">${shieldChipInner()}</span>`;
    }

    const BUILT_INS = [
      { id: "apiKeys", label: "API keys", hint: "Stripe, AWS, GitHub prefixes", examples: "e.g. sk-live-abc123…, AKIAIOSFODNN7EXAMPLE, ghp_xxxxxxxx", pattern: /\b(sk-[a-zA-Z0-9_-]{8,}|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{20,})\b/g },
      { id: "jwt", label: "JWT tokens", hint: "Three-part base64 tokens", examples: "e.g. eyJhbGciOiJIUzI1NiIs…", pattern: /\beyJ[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+\b/g },
      { id: "privateKeys", label: "Private keys", hint: "PEM blocks in mail", examples: "e.g. -----BEGIN RSA PRIVATE KEY-----", pattern: /-----BEGIN [A-Z ]+ PRIVATE KEY-----[\s\S]*?-----END [A-Z ]+ PRIVATE KEY-----/g },
      { id: "passwordCtx", label: "Password patterns", hint: "Label = value lines", examples: "e.g. password=hunter2, secret: abc123, token=xyz", pattern: /\b(?:password|passwd|secret|token)\s*[:=]\s*\S+/gi },
      { id: "creditCards", label: "Credit cards", hint: "13–19 digit runs", examples: "e.g. 4111 1111 1111 1111, 3782-822463-10005", pattern: /\b(?:\d[ -]*?){13,19}\b/g },
      { id: "ssn", label: "SSN", hint: "US social security", examples: "e.g. 123-45-6789", pattern: /\b\d{3}-\d{2}-\d{4}\b/g },
      { id: "phones", label: "Phone numbers", hint: "US / intl formats", examples: "e.g. +1 555-0100, (415) 555-1212, 555.867.5309", pattern: /\+?\d[\d\s().-]{8,}\d/g },
      { id: "emails", label: "Email addresses", hint: "name@domain.tld", examples: "e.g. marotron@gmail.com, user@acme.co.uk", pattern: /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g }
    ];

    const INFO_CONTENT = {
      "scope-overview": {
        title: "Scope tab",
        body: `<p>Scope decides <strong>which placements an agent may touch</strong> and sets default Access caps per row.</p>
          <ul>
            <li><strong>Checkbox</strong> → allow or deny a mailbox (or whole account).</li>
            <li><strong>Field badges</strong> (S/F/T/D/B/A/C) → per-placement grant caps; click to toggle what the agent may read.</li>
            <li>${leakGuardChipDemo()} <strong>Leak guard</strong> → opt-in scanning for that placement only. Grant must exist first.</li>
          </ul>
          <p>Grants and leak guard are independent: you can allow body access but still scan subject + body for secrets before MCP responses leave MailGent.</p>`
      },
      "leak-guard-master": {
        title: "Leak guard master switch",
        body: `<p>Global on/off for outbound sanitization. When off, MCP responses pass through after grant checks only — no heuristic scan, no custom rules.</p>
          <ul>
            <li>Runs <strong>on device</strong> after GrantGate, before JSON is returned to the agent.</li>
            <li>Scans <strong>subject + body only</strong> in v1 (headers like From/To are not scanned).</li>
            <li>Requires at least one placement with ${leakGuardChipDemo()} leak guard enabled; otherwise nothing is scanned even if master is on.</li>
            <li>Alpha policy: detector errors <strong>fail open</strong> (content passes unmodified).</li>
          </ul>`
      },
      "shield-scan": {
        title: "Leak guard icon (per placement)",
        body: `<p>Opt-in allowlist entry for leak guard. Same ${leakGuardChipDemo()} icon everywhere — Scope rows, Access asset list, and docs.</p>
          <ul>
            <li>Click ${leakGuardChipDemo("off")} on allowed rows to opt in; ${leakGuardChipDemo("on")} when active.</li>
            <li><strong>Active</strong> ${leakGuardChipDemo("on")} → master on and placement opted in.</li>
            <li><strong>Pending</strong> ${leakGuardChipDemo("pending")} → opted in but master switch off.</li>
            <li><strong>Off</strong> ${leakGuardChipDemo("off")} → not opted in.</li>
            <li>Account-wide grants show one icon for the whole account (<code>accountID/*</code>).</li>
            <li>Empty allowlist → warning on Scope when master is on; preview shows <em>scan skipped</em>.</li>
          </ul>`
      },
      "grant-field-badges": {
        title: "Grant field badges",
        body: `<p>Compact caps for what the agent may read on this placement. Blue = granted; struck-through = withheld.</p>
          <ul>
            <li><strong>S</strong> Subject · <strong>F</strong> From · <strong>T</strong> To · <strong>D</strong> Date</li>
            <li><strong>B</strong> Body · <strong>A</strong> Attachment names · <strong>C</strong> Attachment content</li>
          </ul>
          <p>Denied fields return <code>not_granted</code> in MCP JSON and show red hatch in the access log. Leak guard never upgrades a denied field — it only sanitizes granted subject/body text.</p>`
      },
      "access-overview": {
        title: "Access tab",
        body: `<p>Edit field caps for one allowed placement at a time. Each grant asset keeps its own <code>GrantFields</code> snapshot.</p>
          <ul>
            <li>Select an asset in the list → badges below toggle caps for that placement only.</li>
            <li><strong>Preview as</strong> dropdown drives the live preview on the right (grant + leak guard for that path).</li>
            <li>${leakGuardChipDemo()} in the asset list mirrors Scope — toggle on Scope rows or below when editing.</li>
          </ul>
          <p>Presets (Headers only / Read mail / Full) ship in production; this prototype uses per-badge toggles only.</p>`
      },
      "privacy-builtins": {
        title: "Built-in detectors",
        body: `<p>Heuristic regex classes applied to granted subject + body on ${leakGuardChipDemo()} opted-in placements. No Core ML in v1.</p>
          <ul>
            <li>Each class can be toggled independently.</li>
            <li>On match → redact with <code>[REDACTED:category]</code> unless a custom rule overlaps with replace action.</li>
            <li>Longest match wins when spans overlap; custom rules follow list order after built-ins are collected.</li>
          </ul>
          <p>Tap <strong>i</strong> on a detector row for examples, pattern detail, and false-positive notes.</p>`
      },
      "custom-filters": {
        title: "Custom filters",
        body: `<p>User-defined patterns for names, addresses, internal IDs, etc.</p>
          <ul>
            <li><strong>Literal</strong> — exact substring (optional case insensitive).</li>
            <li><strong>Wildcard</strong> — <code>*</code> and <code>?</code> glob, not path-style.</li>
            <li><strong>Regex</strong> — JavaScript regex; invalid patterns blocked on save.</li>
            <li><strong>Redact</strong> → marker in output; agent always sees <code>sanitized</code>.</li>
            <li><strong>Replace</strong> → fake value; choose whether agent is told (disclosed) or not (stealth).</li>
          </ul>
          <p>Rules are global — they apply on every ${leakGuardChipDemo()} opted-in placement when enabled.</p>`
      },
      "hit-modes": {
        title: "On confidential hit",
        body: `<p>Per-field behavior when any detector or custom rule matches.</p>
          <ul>
            <li><strong>Redact / replace matching parts</strong> — only matched spans change; rest of field stays granted. MCP: <code>sanitized</code> + <code>sanitizedRules</code> when disclosed.</li>
            <li><strong>Block entire field</strong> — whole subject or body withheld. MCP: <code>withheld_confidential</code>, reason <code>leak_guard</code>; access log shows purple shield, not hatch.</li>
          </ul>
          <p>Subject and body can use different modes (e.g. redact body spans but block sensitive subjects entirely).</p>`
      },
      "stealth-replace": {
        title: "Stealth vs disclosed replace",
        body: `<p>When a custom rule uses <strong>Replace with fake value</strong>:</p>
          <ul>
            <li><strong>Tell agent sanitized</strong> (on) → MCP flags <code>sanitized</code>, includes rule label in <code>sanitizedRules</code>; access log shows purple-tinted spans with hover original.</li>
            <li><strong>Stealth</strong> (off) → agent sees <code>granted</code> plain text with fake value baked in; human audit log still retains original for hover/tooltip.</li>
          </ul>
          <p>Redact actions are always disclosed. Stealth is for cases where the agent should treat substituted text as real (e.g. pseudonym in a coaching thread).</p>`
      },
      "preview-states": {
        title: "Preview: grant vs leak guard",
        body: `<p>Three visually distinct outcomes — never conflate grant denial with autodetect.</p>

            <li><span class="tag leak">Leak</span> Purple shield — whole field blocked because hit mode = block entire field.</li>
            <li><span class="tag leak">Leak</span> Purple tint — span redacted or replaced; hover for original in access log mock.</li>
            <li><strong>Stealth replace</strong> — preview badge shows granted; JSON may include a <code>note</code> for humans only.</li>
          </ul>`
      },
      "mcp-access-flags": {
        title: "MCP access flags",
        body: `<p>Fragment fields the agent consumes on <code>get</code> (v1 subject + body):</p>
          <ul>
            <li><code>subjectAccess</code> / <code>bodyAccess</code> — <code>granted</code> · <code>not_granted</code> · <code>sanitized</code> · <code>withheld_confidential</code></li>
            <li><code>subjectAccessReason</code> / <code>bodyAccessReason</code> — <code>grant</code> or <code>leak_guard</code></li>
            <li><code>sanitizedRules</code> — labels of rules that fired (disclosed replaces + all redactions)</li>
          </ul>
          <p>Grant denial uses <code>not_granted</code> + reason <code>grant</code>. Autodetect never uses <code>not_granted</code>.</p>`
      }
    };

    BUILT_INS.forEach(b => {
      const examplesHtml = b.examples
        ? `<p class="info-examples"><strong>Examples</strong>${esc(b.examples)}</p>`

      INFO_CONTENT["builtin-" + b.id] = {
        title: b.label,
        body: builtinDetail(b.id) + examplesHtml

    });

    function builtinDetail(id) {
      const map = {
        apiKeys: `<p>Matches common secret prefixes in mail threads and forwards.</p>
          <ul><li>Stripe <code>sk-…</code> · AWS <code>AKIA…</code> · GitHub <code>ghp_…</code></li>
          <li>Action: redact span → <code>[REDACTED:apiKeys]</code></li>
          <li>False positives: product codes starting with <code>sk-</code> in non-secret context — tune with custom allow patterns later.</li></ul>`,
        jwt: `<p>Three base64url segments separated by dots (<code>header.payload.sig</code>).</p>
          <ul><li>Often pasted into support tickets or CI logs forwarded by email.</li>
          <li>Action: redact entire token string.</li></ul>`,
        privateKeys: `<p>PEM blocks between BEGIN/END PRIVATE KEY lines, including multiline bodies.</p>
          <ul><li>Common when devs email themselves backup keys (bad practice, frequent in real mail).</li>
          <li>Action: redact full PEM block.</li></ul>`,
        passwordCtx: `<p>Labelled secrets: <code>password=</code>, <code>secret:</code>, <code>token=</code>, etc.</p>
          <ul><li>Case-insensitive label; value runs to next whitespace.</li>
          <li>May catch login URLs in prose — disable if noisy for your mail.</li></ul>`,
        creditCards: `<p>13–19 digit runs with optional spaces/dashes (Luhn not verified in v1).</p>
          <ul><li>May match long order/tracking numbers — pair with hit mode or custom exceptions.</li></ul>`,
        ssn: `<p>US Social Security format <code>###-##-####</code> only.</p>`,
        phones: `<p>US and loose international formats: <code>+1 …</code>, parentheses, dots.</p>
          <ul><li>Custom literal rules better for your known numbers (see sample “My phone”).</li></ul>`,
        emails: `<p>Generic <code>local@domain.tld</code> pattern.</p>
          <ul><li>Can be broad — disable if you rely on From/To headers and only want custom address rules.</li></ul>`
      };
      return map[id] || "<p>Built-in heuristic detector.</p>";
    }

    function infoBtn(id) {
      const on = state.expandedInfo === id;
      return `<button type="button" class="info-btn ${on ? "on" : ""}" data-info="${id}" aria-expanded="${on}" title="More information">i</button>`;
    }

    function infoPanel(id) {
      if (state.expandedInfo !== id) return "";
      const content = INFO_CONTENT[id];
      if (!content) return "";
      return `<div class="info-panel" role="region" aria-labelledby="info-title-${id}"><h4 id="info-title-${id}">${esc(content.title)}</h4>${content.body}</div>`;
    }

    function toggleInfo(id) {
      state.expandedInfo = state.expandedInfo === id ? null : id;
      renderDesk();
    }

    function mountPreviewInfoSlots() {
      ["preview-states", "mcp-access-flags"].forEach(id => {
        const slot = document.getElementById("info-slot-" + id);
        if (slot) slot.innerHTML = infoPanel(id);
        document.querySelectorAll(`[data-info="${id}"]`).forEach(btn => {
          const on = state.expandedInfo === id;
          btn.classList.toggle("on", on);
          btn.setAttribute("aria-expanded", on);

    const state = {
      deskTab: "scope",
      isEditing: true,
      guardOn: true,
      leakGuardScopes: new Set(["work/INBOX", "work/Sent", "personal/INBOX"]),
      draftFrom: "",
      draftDate: "",
      denyMode: false,
      grants: [
        { mode: "allow", accountID: "work", placement: "INBOX", fields: { ...DEFAULT_FIELDS, body: true } },
        { mode: "allow", accountID: "work", placement: "Sent", fields: { ...DEFAULT_FIELDS, body: true } },
        { mode: "allow", accountID: "personal", placement: "INBOX", fields: { ...DEFAULT_FIELDS } },
      ],
      selectedKey: "allow|work|INBOX",
      previewScope: "work/INBOX",
      builtIn: Object.fromEntries(BUILT_INS.map(b => [b.id, ["apiKeys", "jwt", "passwordCtx"].includes(b.id)])),
      rules: [
        { id: crypto.randomUUID(), label: "My name", kind: "literal", pattern: "Marotron", caseInsensitive: true, action: "replace", actionValue: "John Smith", discloseToAgent: false, enabled: true },
        { id: crypto.randomUUID(), label: "My phone", kind: "literal", pattern: "+1 555-0100", caseInsensitive: false, action: "redact", actionValue: "[REDACTED:phone]", discloseToAgent: true, enabled: true },
        { id: crypto.randomUUID(), label: "Home address", kind: "wildcard", pattern: "*Evergreen Terrace*", caseInsensitive: true, action: "redact", actionValue: "[REDACTED:address]", discloseToAgent: true, enabled: true }
      ],
      subjectHitMode: "redactSpans",
      bodyHitMode: "redactSpans",
      editingRuleId: null,
      expandedInfo: null
    };

    function assetKey(g) {
      return `${g.mode}|${g.accountID}|${g.placement ?? "*"}`;
    }

    function scopeKey(accountID, placement) {
      return placement == null ? accountID + "/*" : accountID + "/" + placement;
    }

    function labelFor(accountID) {
      return CATALOG.find(c => c.id === accountID)?.label || accountID;
    }

    function pathLabel(g) {
      const acct = labelFor(g.accountID);
      if (g.placement == null) return `${acct} · all mailboxes`;
      return `${acct} / ${g.placement}`;
    }

    function findGrant(accountID, placement, mode) {
      return state.grants.find(g => g.mode === mode && g.accountID === accountID && g.placement === placement);
    }

    function hasAccountWide(accountID) {
      return !!findGrant(accountID, null, "allow");
    }

    function hasMailbox(accountID, placement) {
      return !!findGrant(accountID, placement, "allow");
    }

    function effectiveAllowFields(accountID, placement) {
      const aw = findGrant(accountID, null, "allow");
      if (aw) return aw.fields;
      const mb = findGrant(accountID, placement, "allow");
      return mb ? mb.fields : null;
    }

    function allowAssets() {
      return state.grants.filter(g => g.mode === "allow");

    function selectedGrant() {
      return state.grants.find(g => assetKey(g) === state.selectedKey) || allowAssets()[0] || null;

    function wireDevPanel() {
      const devSubj = document.getElementById("devSubject");
      const devBody = document.getElementById("devBody");
      if (devSubj) {
        devSubj.oninput = e => {
          document.getElementById("sampleSubject").value = e.target.value;
          runPreview();
        };
      }
      if (devBody) {
        devBody.oninput = e => {
          document.getElementById("sampleBody").value = e.target.value;
          runPreview();
        };
      }
    }

    function wireFieldPills(rootSelector) {
      document.querySelectorAll(`${rootSelector} button.pill[data-field]`).forEach(btn => {
        btn.onclick = () => toggleGrantField(btn.dataset.acct, btn.dataset.place, btn.dataset.field);
      });
      document.querySelectorAll(`${rootSelector} button.btn-preset[data-preset]`).forEach(btn => {
        btn.onclick = () => applyPreset(btn.dataset.acct, btn.dataset.place, btn.dataset.preset);
      });
    }

    function upsert(grant) {
      const key = assetKey(grant);
      const i = state.grants.findIndex(g => assetKey(g) === key);
      if (i >= 0) state.grants[i] = grant;
      else state.grants.push(grant);
      state.selectedKey = key;
    }

    function remove(accountID, placement, mode) {
      const key = `${mode}|${accountID}|${placement ?? "*"}`;
      state.grants = state.grants.filter(g => assetKey(g) !== key);
      const sk = scopeKey(accountID, placement);
      state.leakGuardScopes.delete(sk);
      if (state.selectedKey === key) {
        const next = allowAssets()[0];
        state.selectedKey = next ? assetKey(next) : null;
      }
    }

    function allow(accountID, placement) {
      const existing = findGrant(accountID, placement, "allow");
      upsert({
        mode: "allow",
        accountID,
        placement,
        fields: existing ? { ...existing.fields } : { ...DEFAULT_FIELDS },
      });
    }

    function setAccountWide(accountID, enabled) {
      if (!enabled) {
        remove(accountID, null, "allow");
        renderDesk();
        return;
      }
      state.grants = state.grants.filter(g => !(g.mode === "allow" && g.accountID === accountID && g.placement != null));
      allow(accountID, null);
      renderDesk();
    }

    function setMailbox(accountID, placement, enabled) {
      if (enabled) allow(accountID, placement);
      else remove(accountID, placement, "allow");
      renderDesk();
    }

    function toggleGrantField(accountID, placement, fieldKey) {
      const place = placement === "*" ? null : placement;
      const g = findGrant(accountID, place, "allow");
      if (!g) return;
      const fields = { ...g.fields };
      fields[fieldKey] = !fields[fieldKey];
      if (fieldKey === "attachmentMetadata" && !fields.attachmentMetadata) fields.attachmentContent = false;
      if (fieldKey === "attachmentContent" && fields.attachmentContent) fields.attachmentMetadata = true;
      g.fields = fields;
      state.selectedKey = assetKey(g);
      renderDesk();
    }

    function toggleShield(accountID, placement) {
      const key = scopeKey(accountID, placement === "*" ? null : placement);
      if (state.leakGuardScopes.has(key)) state.leakGuardScopes.delete(key);
      else state.leakGuardScopes.add(key);
      renderDesk();
    }

    function isScopeProtected(simKey) {
      if (!state.guardOn || !state.leakGuardScopes.size) return false;
      if (state.leakGuardScopes.has(simKey)) return true;
      const [accountID] = simKey.split("/");
      return state.leakGuardScopes.has(accountID + "/*");
    }

    function grantFieldsForScope(simKey) {
      const [accountID, placement] = simKey.split("/");
      return effectiveAllowFields(accountID, placement) || DEFAULT_FIELDS;
    }

    function globToRegExp(glob, ci) {
      const esc = glob.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*").replace(/\?/g, ".");
      return new RegExp(esc, ci ? "gi" : "g");
    }

    function findLiteral(text, needle, ci) {
      const hits = [];
      const hay = ci ? text.toLowerCase() : text;
      const nd = ci ? needle.toLowerCase() : needle;
      let i = 0;
      while ((i = hay.indexOf(nd, i)) !== -1) {
        hits.push({ start: i, end: i + needle.length });
        i += needle.length || 1;
      }
      return hits;
    }

    function findRegex(text, pattern, ci) {
      try {
        const re = pattern instanceof RegExp ? pattern : new RegExp(pattern, ci ? "gi" : "g");
        const hits = [];
        let m;
        re.lastIndex = 0;
        while ((m = re.exec(text)) !== null) {
          hits.push({ start: m.index, end: m.index + m[0].length });
          if (m[0].length === 0) re.lastIndex++;
        }
        return hits;
      } catch (_) {
        return [];
      }
    }

    function collectHits(text) {
      const hits = [];
      for (const b of BUILT_INS) {
        if (!state.builtIn[b.id]) continue;
        for (const span of findRegex(text, b.pattern)) {
          hits.push({ ...span, label: b.label, source: "builtIn:" + b.id, action: "redact", actionValue: `[REDACTED:${b.id}]`, discloseToAgent: true });
        }
      }
      for (const rule of state.rules) {
        if (!rule.enabled) continue;
        let spans = [];
        if (rule.kind === "literal") spans = findLiteral(text, rule.pattern, rule.caseInsensitive);
        else if (rule.kind === "wildcard") spans = findRegex(text, globToRegExp(rule.pattern, rule.caseInsensitive));
        else spans = findRegex(text, rule.pattern, rule.caseInsensitive);
        for (const span of spans) {
          hits.push({
            ...span,
            label: rule.label,
            source: "custom:" + rule.id,
            action: rule.action,
            actionValue: rule.actionValue || `[REDACTED:${rule.label}]`,
            discloseToAgent: rule.action === "redact" ? true : !!rule.discloseToAgent
          });
        }
      }
      return hits;
    }

    function resolveOverlaps(hits) {
      const sorted = [...hits].sort((a, b) => (b.end - b.start) - (a.end - a.start) || a.start - b.start);
      const kept = [];
      for (const h of sorted) {
        if (kept.some(k => !(h.end <= k.start || h.start >= k.end))) continue;
        kept.push(h);
      }
      return kept.sort((a, b) => a.start - b.start);
    }

    function applyHits(text, hits, hitMode) {
      if (!hits.length) {
        return { text, access: "granted", agentAccess: "granted", reason: null, rules: [], disclosedRules: [], hitSpans: [], stealth: false };
      }
      if (hitMode === "blockWhole") {
        const labels = [...new Set(hits.map(h => h.label))];
        return {
          text: "",
          access: "withheld_confidential",
          agentAccess: "withheld_confidential",
          reason: "leak_guard",
          rules: labels,
          disclosedRules: labels,
          hitSpans: hits,
          stealth: false
        };
      }
      let out = text;
      const rules = new Set();
      const disclosedRules = new Set();
      for (const h of [...hits].sort((a, b) => b.start - a.start)) {
        const rep = h.action === "replace" ? h.actionValue : (h.actionValue || `[REDACTED:${h.label}]`);
        out = out.slice(0, h.start) + rep + out.slice(h.end);
        rules.add(h.label);
        if (h.discloseToAgent) disclosedRules.add(h.label);
      }
      const agentAccess = disclosedRules.size > 0 ? "sanitized" : "granted";
      return {
        text: out,
        access: "sanitized",
        agentAccess,
        reason: agentAccess === "sanitized" ? "leak_guard" : "grant",
        rules: [...rules],
        disclosedRules: [...disclosedRules],
        hitSpans: hits,
        stealth: agentAccess === "granted"
      };
    }

    function sanitizeField(raw, field, simKey) {
      const grant = grantFieldsForScope(simKey);
      if (!grant[field]) {
        return { text: "", access: "not_granted", reason: "grant", rules: [], original: raw };
      }
      if (!state.guardOn || !isScopeProtected(simKey)) {
        return { text: raw, access: "granted", reason: "grant", rules: [], original: raw };
      }
      const hits = resolveOverlaps(collectHits(raw));
      const hitMode = field === "subject" ? state.subjectHitMode : state.bodyHitMode;
      const applied = applyHits(raw, hits, hitMode);
      return { ...applied, original: raw, hitSpans: hits };
    }

    function renderSanitizedHtml(original, sanitized, hitSpans, hitMode) {
      if (hitMode === "blockWhole") return '<span class="withheld-label">Withheld — autodetect</span>';
      if (!hitSpans?.length) return escapeHtml(sanitized);
      let html = "";
      let cursor = 0;
      for (const h of hitSpans) {
        html += escapeHtml(original.slice(cursor, h.start));
        const orig = original.slice(h.start, h.end);
        const rep = h.action === "replace" ? h.actionValue : (h.actionValue || `[REDACTED:${h.label}]`);
        html += `<span class="sanitized-text" title="Original: ${escapeAttr(orig)}">${escapeHtml(rep)}</span>`;
        cursor = h.end;
      }
      html += escapeHtml(original.slice(cursor));
      return html;
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function escapeAttr(s) { return escapeHtml(s).replace(/"/g, "&quot;"); }
    const escAttr = escapeAttr;
    function esc(s) { return escapeHtml(String(s)); }

    function badgeFor(access, reason, stealth) {
      if (access === "not_granted") return '<span class="badge grant">not_granted · grant</span>';
      if (access === "withheld_confidential") return '<span class="badge leak">withheld · leak_guard</span>';
      if (access === "sanitized") return '<span class="badge leak">sanitized · leak_guard</span>';
      if (stealth) return '<span class="badge stealth">granted · stealth replace</span>';
      return '<span class="badge ok">granted</span>';
    }

    function highlightAgentText(result) {
      if (result.access === "not_granted") return '<span class="hatch"></span>';
      if (result.access === "withheld_confidential") return '<span class="withheld-label">Field withheld (confidential)</span>';
      return escapeHtml(result.text);
    }

    function runPreview() {
      const mount = document.getElementById("previewMount");
      if (mount) {
        renderPreviewSection("previewMount");
        wireDevPanel();
        mountPreviewInfoSlots();
      }
    }

    function syntaxJson(raw) {
      return raw.replace(/"([^"]+)":/g, '<span class="k">"$1"</span>:')
        .replace(/: "([^"]*)"/g, ': <span class="s">"$1"</span>')
        .replace(/: (\d+)/g, ': <span class="n">$1</span>');
    }

    function renderScope() {
      const rows = CATALOG.map(acct => {
        const accountWide = hasAccountWide(acct.id);
        const awGrant = accountWide ? findGrant(acct.id, null, "allow") : null;
        const head = `<div class="check-row">
          <button type="button" class="check emph ${accountWide ? "on" : ""}" data-acct="${acct.id}">
            <span class="box"></span><span class="t">${acct.label}</span>
          </button>
          ${awGrant ? `<span class="mini">${badgeCaps(awGrant.fields, { interactive: true, accountID: acct.id, placement: null })}${scopeLeakControls(acct.id, null, true)}</span>` : ""}
        </div>`;
        const boxes = acct.mailboxes.map(m => {
          const mb = findGrant(acct.id, m, "allow");
          const allowed = accountWide || !!mb;
          const editGrant = accountWide ? awGrant : mb;
          const editPlace = accountWide ? null : m;
          const caps = editGrant && allowed
            ? badgeCaps(editGrant.fields, { interactive: true, accountID: acct.id, placement: editPlace })
            : "";
          const leak = allowed ? scopeLeakControls(acct.id, editPlace ?? m, true) : "";
          return `<div class="check-row indent">
            <button type="button" class="check ${allowed ? "on" : ""}" data-acct="${acct.id}" data-mb="${m}" ${accountWide ? "disabled" : ""}>
              <span class="box"></span><span class="t">${m}</span>
            </button>
            ${(caps || leak) ? `<span class="mini">${caps}${leak}</span>` : ""}
          </div>`;
        }).join("");
        return `<div class="acct">${head}${boxes}</div>`;
      }).join("");

      const anyShield = state.leakGuardScopes.size > 0;
      document.getElementById("pane-scope").innerHTML = `
        <div class="master-row">
          <label for="guardOnScope">Leak guard master<small>Same switch as Privacy — disables all scanning when off</small></label>
          <div class="master-controls">
            ${infoBtn("leak-guard-master")}
            <button type="button" class="toggle ${state.guardOn ? "on" : ""}" id="guardOnScope" aria-pressed="${state.guardOn}"></button>
          </div>
        </div>
        ${infoPanel("leak-guard-master")}
        <div class="card">
          <div class="card-head">
            <span class="card-title">Allowed placements</span>
            ${infoBtn("scope-overview")}
          </div>
          ${infoPanel("scope-overview")}
          <div class="card-body card-hint-row">
            <p class="card-hint">Check placements to allow. Field badges = Access caps ${infoBtn("grant-field-badges")} · Leak guard ${infoBtn("shield-scan")} = opt-in scanning.</p>
            ${infoPanel("grant-field-badges")}
            ${infoPanel("shield-scan")}
          </div>
          <div class="card-body flush"><div class="catalog">${rows}</div></div>
        </div>
        <div class="card">
          <div class="card-head"><span class="card-title">Narrow scope</span></div>
          <div class="card-body">
            <input class="field" id="from" placeholder="Narrow From (optional)" value="${escAttr(state.draftFrom)}" style="margin-bottom:8px">
            <input class="field" id="date" placeholder="On/after date ISO8601 (optional)" value="${escAttr(state.draftDate)}" style="margin-bottom:0">
          </div>
        </div>
        ${state.grants.length ? `<button type="button" class="btn danger" id="clear">Clear all grants</button>` : ""}
        <p class="warn" id="allowlistWarn" ${state.guardOn && !anyShield ? "" : "hidden"}>Leak guard is on but no placements are opted in — nothing will be scanned.</p>
        ${allowAssets().length ? `<p class="hint" style="margin-top:8px">Detectors & custom rules → <button type="button" id="goto-privacy" style="border:0;background:none;color:var(--blue);font-weight:700;padding:0;text-decoration:underline">Privacy</button> tab.</p>` : ""}
      `;

      document.getElementById("guardOnScope").onclick = () => {
        state.guardOn = !state.guardOn;
        renderDesk();
      };
      document.getElementById("from").oninput = e => { state.draftFrom = e.target.value; };
      document.getElementById("date").oninput = e => { state.draftDate = e.target.value; };
      const clear = document.getElementById("clear");
      if (clear) clear.onclick = () => {
        state.grants = [];
        state.leakGuardScopes.clear();
        state.selectedKey = null;
        renderDesk();
      };
      const go = document.getElementById("goto-privacy");
      if (go) go.onclick = () => setDeskTab("privacy");

      document.querySelectorAll("#pane-scope .check[data-acct]:not([data-mb])").forEach(btn => {
        btn.onclick = () => setAccountWide(btn.dataset.acct, !hasAccountWide(btn.dataset.acct));
      });
      document.querySelectorAll("#pane-scope .check[data-mb]").forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.acct;
          const m = btn.dataset.mb;
          setMailbox(id, m, !(hasAccountWide(id) || hasMailbox(id, m)));
        };
      });
      document.querySelectorAll("#pane-scope button.chip[data-field]").forEach(btn => {
        btn.onclick = e => {
          e.stopPropagation();
          toggleGrantField(btn.dataset.acct, btn.dataset.place, btn.dataset.field);
        };
      });
      document.querySelectorAll("#pane-scope button.chip[data-shield]").forEach(btn => {
        btn.onclick = e => {
          e.stopPropagation();
          toggleShield(btn.dataset.acct, btn.dataset.place);
        };
      });
    }

    function renderAccess() {
      const assets = allowAssets();
      if (!assets.length) {
        document.getElementById("pane-access").innerHTML = `
          <p class="hint">No placement assets yet. Allow mailboxes on Scope first.</p>
          <button type="button" class="btn" id="back-scope">← Scope</button>`;
        document.getElementById("back-scope").onclick = () => setDeskTab("scope");
        return;
      }
      if (!selectedGrant()) state.selectedKey = assetKey(assets[0]);
      const g = selectedGrant();
      const list = assets.map(a => {
        const key = assetKey(a);
        return `<button type="button" class="asset ${key === state.selectedKey ? "sel" : ""}" data-key="${key}">
          <div class="path">${esc(pathLabel(a))}</div>
          <div class="caps">${badgeCaps(a.fields)}${shieldBadge(a.accountID, a.placement)}</div>
        </button>`;
      }).join("");

      if (g.placement != null) state.previewScope = scopeKey(g.accountID, g.placement);
      else {
        const acct = CATALOG.find(c => c.id === g.accountID);
        state.previewScope = g.accountID + "/" + (acct?.mailboxes[0] || "INBOX");
      }

      document.getElementById("pane-access").innerHTML = `
        <div class="access-split">
          <div>
            <div class="assets-label">Assets</div>
            <div class="asset-list">${list}</div>
          </div>
          <div>
            <p class="field-headline">${esc(pathLabel(g))}</p>
            <p class="field-sub">Fields apply only to this allow.</p>
            ${leakGuardAccessHtml(g)}
            ${presetButtonsHtml(g)}
            <div class="pill-group">
              <div class="pill-group-label">Envelope</div>
              <div class="pill-row">${fieldPillRow("envelope", g.fields, g.accountID, g.placement ?? "*", true)}</div>
            </div>
            <div class="pill-group">
              <div class="pill-group-label">Content</div>
              <div class="pill-row">${fieldPillRow("content", g.fields, g.accountID, g.placement ?? "*", true)}</div>
            </div>
            <div class="divider"></div>
            <div id="previewMount"></div>
          </div>
        </div>`;

      document.querySelectorAll("#pane-access .asset").forEach(btn => {
        btn.onclick = () => {
          state.selectedKey = btn.dataset.key;
          const sel = state.grants.find(g => assetKey(g) === state.selectedKey);
          if (sel?.placement != null) state.previewScope = scopeKey(sel.accountID, sel.placement);
          renderDesk();
        };
      });
      document.querySelectorAll("#pane-access button.chip[data-field]").forEach(btn => {
        btn.onclick = () => toggleGrantField(btn.dataset.acct, btn.dataset.place, btn.dataset.field);
      });
      document.querySelectorAll("#pane-access button[data-shield-toggle]").forEach(btn => {
        btn.onclick = () => toggleShield(btn.dataset.acct, btn.dataset.place);
      });
      wireFieldPills("#pane-access");
    }

    function renderPrivacy() {
      document.getElementById("pane-privacy").innerHTML = `
        <div class="master-row">
          <label for="guardOnPrivacy">Leak guard master<small>Same switch as Scope — disables all scanning when off</small></label>
          <div class="master-controls">
            ${infoBtn("leak-guard-master")}
            <button type="button" class="toggle ${state.guardOn ? "on" : ""}" id="guardOnPrivacy" aria-pressed="${state.guardOn}"></button>
          </div>
        </div>
        ${infoPanel("leak-guard-master")}
        <div class="card">
          <div class="card-head">
            <span class="card-title">Built-in detectors</span>
            ${infoBtn("privacy-builtins")}
          </div>
          ${infoPanel("privacy-builtins")}
          <div class="card-body" id="builtIns"></div>
        </div>
        <div class="card">
          <div class="card-head">
            <span class="card-title">Custom filters</span>
            ${infoBtn("custom-filters")}
          </div>
          ${infoPanel("custom-filters")}
          <div class="card-body flush">
            <div class="rules" id="ruleList"></div>
          </div>
          <div class="card-body">
            <button type="button" class="btn primary" id="addRule">Add filter</button>
            <div class="editor hidden" id="ruleEditor">
              <div class="grid2" style="margin-bottom:8px">
                <div><label>Label</label><input type="text" id="editLabel" placeholder="My name"></div>
                <div><label>Match kind</label>
                  <select id="editKind">
                    <option value="literal">Literal</option>
                    <option value="wildcard">Wildcard (* ?)</option>
                    <option value="regex">Regex</option>
                  </select>
                </div>
              </div>
              <div style="margin-bottom:8px"><label>Pattern</label><input type="text" id="editPattern" placeholder="Marotron"></div>
              <div class="grid2" style="margin-bottom:8px">
                <div><label>Action</label>
                  <select id="editAction">
                    <option value="redact">Redact with marker</option>
                    <option value="replace">Replace with fake value</option>
                  </select>
                </div>
                <div><label id="editActionValueLabel">Marker / replacement</label><input type="text" id="editActionValue"></div>
              </div>
              <label class="check-inline"><input type="checkbox" id="editCaseInsensitive" checked> Case insensitive</label>
              <div class="row" id="discloseRow" style="margin-top:8px">
                <label for="editDisclose">Tell agent this value was sanitized<small>Off = stealth fake value</small></label>
                <div class="row-controls">
                  ${infoBtn("stealth-replace")}
                  <button type="button" class="toggle" id="editDisclose" aria-pressed="false"></button>
                </div>
              </div>
              ${infoPanel("stealth-replace")}
              <div style="margin-top:8px;display:flex;gap:6px">
                <button type="button" class="btn primary" id="saveRule">Save</button>
                <button type="button" class="btn" id="cancelRule">Cancel</button>
              </div>
              <div class="err" id="editErr" hidden></div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-head">
            <span class="card-title">On confidential hit</span>
            ${infoBtn("hit-modes")}
          </div>
          ${infoPanel("hit-modes")}
          <div class="card-body">
            <div class="grid2">
              <div><label>Subject</label>
                <select id="subjectHitMode">
                  <option value="redactSpans">Redact / replace matching parts</option>
                  <option value="blockWhole">Block entire field</option>
                </select>
              </div>
              <div><label>Body</label>
                <select id="bodyHitMode">
                  <option value="redactSpans">Redact / replace matching parts</option>
                  <option value="blockWhole">Block entire field</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <p class="hint">Per-placement opt-in is on <button type="button" id="goto-scope" style="border:0;background:none;color:var(--blue);font-weight:700;padding:0;text-decoration:underline">Scope</button> (leak guard icon).</p>
        <div class="divider"></div>
        <div id="previewMount"></div>`;

      document.getElementById("guardOnPrivacy").onclick = () => {
        state.guardOn = !state.guardOn;
        renderDesk();
      };
      document.getElementById("goto-scope").onclick = () => setDeskTab("scope");
      document.getElementById("subjectHitMode").value = state.subjectHitMode;
      document.getElementById("bodyHitMode").value = state.bodyHitMode;
      document.getElementById("subjectHitMode").onchange = e => { state.subjectHitMode = e.target.value; runPreview(); };
      document.getElementById("bodyHitMode").onchange = e => { state.bodyHitMode = e.target.value; runPreview(); };

      renderBuiltIns();
      renderRules();
      wireRuleEditor();
    }

    function renderBuiltIns() {
      const root = document.getElementById("builtIns");
      if (!root) return;
      root.innerHTML = BUILT_INS.map(b => {
        const infoId = "builtin-" + b.id;
        return `
        <div class="row-wrap">
          <div class="row">
            <label for="builtin-${b.id}">${b.label}<small>${b.hint}</small></label>
            <div class="row-controls">
              ${infoBtn(infoId)}
              <button type="button" class="toggle ${state.builtIn[b.id] ? "on" : ""}" id="builtin-${b.id}" data-builtin="${b.id}" aria-pressed="${state.builtIn[b.id]}"></button>
            </div>
          </div>
          ${infoPanel(infoId)}
        </div>`;
      }).join("");
      root.querySelectorAll(".toggle[data-builtin]").forEach(btn => {
        btn.onclick = () => {
          state.builtIn[btn.dataset.builtin] = !state.builtIn[btn.dataset.builtin];
          renderDesk();
        };
      });
    }

    function renderRules() {
      const list = document.getElementById("ruleList");
      if (!list) return;
      if (!state.rules.length) {
        list.innerHTML = '<div class="rule"><span style="color:var(--muted)">No custom filters yet.</span></div>';
        return;
      }
      list.innerHTML = state.rules.map(r => `
        <div class="rule">
          <div>
            <strong>${esc(r.label)}</strong>${r.enabled ? "" : ' <span style="color:var(--muted)">(off)</span>'}
            <div class="meta">${r.kind} · “${esc(r.pattern)}” → ${r.action === "replace" ? "replace" : "redact"} “${esc(r.actionValue)}”${r.action === "replace" ? (r.discloseToAgent ? " · agent aware" : " · stealth") : ""}</div>
          </div>
          <div class="actions">
            <button type="button" data-edit="${r.id}">Edit</button>
            <button type="button" data-toggle="${r.id}">${r.enabled ? "Off" : "On"}</button>
            <button type="button" class="danger" data-del="${r.id}">Del</button>
          </div>
        </div>
      `).join("");
      list.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openEditor(b.dataset.edit)));
      list.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("click", () => {
        state.rules.find(x => x.id === b.dataset.toggle).enabled = !state.rules.find(x => x.id === b.dataset.toggle).enabled;
        renderDesk();
      }));
      list.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
        state.rules = state.rules.filter(x => x.id !== b.dataset.del);
        renderDesk();
      }));
    }

    function setDiscloseToggle(on) {
      const btn = document.getElementById("editDisclose");
      if (!btn) return;
      btn.classList.toggle("on", on);
      btn.setAttribute("aria-pressed", on);
    }

    function openEditor(id) {
      state.editingRuleId = id;
      const r = state.rules.find(x => x.id === id) || {
        label: "", kind: "literal", pattern: "", action: "redact", actionValue: "[REDACTED:custom]", caseInsensitive: true, discloseToAgent: false, enabled: true
      };
      document.getElementById("ruleEditor").classList.remove("hidden");
      document.getElementById("editLabel").value = r.label;
      document.getElementById("editKind").value = r.kind;
      document.getElementById("editPattern").value = r.pattern;
      document.getElementById("editAction").value = r.action;
      document.getElementById("editActionValue").value = r.actionValue;
      document.getElementById("editCaseInsensitive").checked = r.caseInsensitive;
      document.getElementById("editErr").hidden = true;
      syncActionPlaceholder(r.discloseToAgent);
    }

    function syncActionPlaceholder(disclose) {
      const action = document.getElementById("editAction").value;
      document.getElementById("editActionValueLabel").textContent = action === "replace" ? "Fake value" : "Marker";
      document.getElementById("editActionValue").placeholder = action === "replace" ? "John Smith" : "[REDACTED:label]";
      const showDisclose = action === "replace";
      document.getElementById("discloseRow").classList.toggle("hidden", !showDisclose);
      if (showDisclose) setDiscloseToggle(disclose !== undefined ? disclose : false);
    }

    function wireRuleEditor() {
      document.getElementById("editAction").onchange = () => syncActionPlaceholder();
      document.getElementById("editDisclose").onclick = function () {
        setDiscloseToggle(!this.classList.contains("on"));
      };
      document.getElementById("addRule").onclick = () => {
        state.editingRuleId = null;
        openEditor(null);
        document.getElementById("editLabel").value = "";
        document.getElementById("editPattern").value = "";
      };
      document.getElementById("cancelRule").onclick = () => {
        document.getElementById("ruleEditor").classList.add("hidden");
        state.editingRuleId = null;
      };
      document.getElementById("saveRule").onclick = () => {
        const label = document.getElementById("editLabel").value.trim();
        const pattern = document.getElementById("editPattern").value;
        const kind = document.getElementById("editKind").value;
        const err = document.getElementById("editErr");
        if (!label || !pattern) {
          err.textContent = "Label and pattern are required.";
          err.hidden = false;
          return;
        }
        if (kind === "regex") {
          try { new RegExp(pattern); } catch (e) {
            err.textContent = "Invalid regex: " + e.message;
            err.hidden = false;
            return;
          }
        }
        err.hidden = true;
        const action = document.getElementById("editAction").value;
        const payload = {
          id: state.editingRuleId || crypto.randomUUID(),
          label, kind, pattern,
          caseInsensitive: document.getElementById("editCaseInsensitive").checked,
          action,
          actionValue: document.getElementById("editActionValue").value.trim() || (action === "replace" ? "REDACTED" : `[REDACTED:${label}]`),
          discloseToAgent: action === "replace" ? document.getElementById("editDisclose").classList.contains("on") : true,
          enabled: true
        };
        const idx = state.rules.findIndex(r => r.id === payload.id);
        if (idx >= 0) state.rules[idx] = payload; else state.rules.push(payload);
        document.getElementById("ruleEditor").classList.add("hidden");
        state.editingRuleId = null;
        renderDesk();
      };
    }

    function setDeskTab(tab) {
      state.deskTab = tab;
      document.querySelectorAll("[data-desk-tab]").forEach(b => {
        b.classList.toggle("on", b.dataset.deskTab === tab);
      });
      document.getElementById("pane-scope").classList.toggle("hidden", tab !== "scope");
      document.getElementById("pane-access").classList.toggle("hidden", tab !== "access");
      document.getElementById("pane-privacy").classList.toggle("hidden", tab !== "privacy");
      renderDesk();
    }

    function renderDesk() {
      renderEditControls();
      if (state.deskTab === "scope") renderScope();
      else if (state.deskTab === "access") renderAccess();
      else renderPrivacy();
      runPreview();
    }

    document.body.addEventListener("click", e => {
      const btn = e.target.closest("[data-info]");
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      toggleInfo(btn.dataset.info);
    });

    document.querySelectorAll("[data-desk-tab]").forEach(btn => {
      btn.onclick = () => setDeskTab(btn.dataset.deskTab);
    });

    document.getElementById("sampleSubject").addEventListener("input", runPreview);
    document.getElementById("sampleBody").addEventListener("input", runPreview);

    renderDesk();
  </script>
</body>
</html>
