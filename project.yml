name: MailGent
options:
  bundleIdPrefix: app.mailgent
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  MailStore:
    type: framework
    platform: macOS
    sources:
      - MailStore/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mailgent.MailStore
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: mh_dylib
        DEFINES_MODULE: YES
        OTHER_LDFLAGS: ["$(inherited)", "-lsqlite3"]

  MailGent:
    type: application
    platform: macOS
    sources:
      - path: MailGent
        excludes:
          - Resources/**
    dependencies:
      - target: MailStore
    postbuildScripts:
      - name: Ensure AppIcon assets
        basedOnDependencyAnalysis: false
        script: |
          set -e
          RES="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/Resources"
          mkdir -p "$RES"
          cp -f "${SRCROOT}/MailGent/Resources/AppIcon.icns" "$RES/AppIcon.icns"
          rm -rf "$RES/AppIcon.icon"
          cp -R "${SRCROOT}/MailGent/Resources/AppIcon.icon" "$RES/AppIcon.icon"
          cp -f "${SRCROOT}/CHANGELOG.md" "$RES/CHANGELOG.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mailgent.MailGent
        MARKETING_VERSION: "0.1.7"
        CURRENT_PROJECT_VERSION: 8
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MailGent
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSPrincipalClass: MailGentApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: MailGent/MailGent.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Automatic

  MailStoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MailStore/Tests
    dependencies:
      - target: MailStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mailgent.MailStoreTests
        GENERATE_INFOPLIST_FILE: YES

  AccountIdentityPrototype:
    type: tool
    platform: macOS
    sources:
      - MailStore/Prototype
    dependencies:
      - target: MailStore
      - sdk: AppKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mailgent.AccountIdentityPrototype
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: ["$(inherited)", "-lsqlite3"]

  MailGentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MailGentTests
    dependencies:
      - target: MailGent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mailgent.MailGentTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AccountIdentityPrototype:
    build:
      targets:
        AccountIdentityPrototype: all
    run:
      config: Debug

  MailGent:
    build:
      targets:
        MailGent: all
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: disable
        MAILGENT_VERBOSE: "1"
    test:
      config: Debug
      targets:
        - MailStoreTests
        - MailGentTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
